<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 학교 근처 스마트 점심 찾기</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-hover: #5B4BC4;
            --accent: #00CEC9;
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 206, 201, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #A855F7, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 15px;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #FFF;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .tag {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag:hover, .tag.active {
            background: var(--primary);
            color: #FFF;
            border-color: var(--primary);
        }

        .btn-search {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #8B5CF6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
        }

        /* 결과 화면 디자인 */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .school-info {
            font-size: 14px;
            color: var(--accent);
            font-weight: 600;
        }

        .restaurant-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .restaurant-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .restaurant-card:hover {
            border-color: rgba(0, 206, 201, 0.5);
            transform: translateX(4px);
        }

        .res-main h3 {
            font-size: 18px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .res-category {
            font-size: 12px;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-sub);
        }

        .res-menu {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .res-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
        }

        .res-status {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .seat-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .seat-available {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .seat-crowded {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .seat-full {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .distance-info {
            font-size: 12px;
            color: var(--text-sub);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SCHOOL LUNCH HUB 🍕</h1>
        <p>답답한 급식실을 벗어나 즐기는 맛있는 점심시간</p>
    </header>

    <!-- 검색 섹션 -->
    <div class="search-section">
        <div class="input-group">
            <label>우리 학교 이름</label>
            <input type="text" id="schoolInput" placeholder="예: 언주중학교" value="언주중학교">
        </div>

        <div class="input-group">
            <label>오늘 땡기는 메뉴 또는 맛</label>
            <input type="text" id="tasteInput" placeholder="예: 매운 거, 삼겹살, 돈까스, 달달한 것">
            <div class="tags">
                <span class="tag" onclick="setTaste('매운 거')">🌶️ 매운 거</span>
                <span class="tag" onclick="setTaste('고기/삼겹살')">🥩 고기</span>
                <span class="tag" onclick="setTaste('달달한 디저트')">🍩 단 거</span>
                <span class="tag" onclick="setTaste('바삭한 돈까스')">🍱 돈까스</span>
            </div>
        </div>

        <button class="btn-search" onclick="searchRestaurants()">실시간 식당 및 자석 조회하기</button>
    </div>

    <!-- 결과 출력 섹션 -->
    <div id="resultSection" class="hidden">
        <div class="result-header">
            <span class="school-info" id="schoolAddress">📍 학교 위치 확인 중...</span>
            <span style="font-size: 12px; color: var(--text-sub);">실시간 업데이트 완료</span>
        </div>

        <div class="restaurant-list" id="restaurantList">
            <!-- 식당 카드가 자바스크립트로 동적 추가됩니다 -->
        </div>
    </div>
</div>

<script>
    // 가상의 식당 데이터베이스
    const mockRestaurants = [
        {
            name: "화끈한 불분식",
            category: "매운 거",
            keywords: ["매운 거", "떡볶이", "매운맛"],
            mainMenu: "치즈 범벅 떡볶이 + 튀김 세트",
            price: "6,500원",
            distance: "도보 3분 (210m)",
            seatsLeft: 8,
            totalSeats: 20
        },
        {
            name: "직화 삼겹 덮밥집",
            category: "고기/삼겹살",
            keywords: ["고기", "삼겹살", "덮밥"],
            mainMenu: "훈제 삼겹살 덮밥 (고기추가 가능)",
            price: "8,500원",
            distance: "도보 5분 (350m)",
            seatsLeft: 3,
            totalSeats: 15
        },
        {
            name: "카츠 마스터",
            category: "바삭한 돈까스",
            keywords: ["돈까스", "바삭한 것", "일식"],
            mainMenu: "수제 등심 돈까스 정식",
            price: "9,000원",
            distance: "도보 4분 (280m)",
            seatsLeft: 0,
            totalSeats: 16
        },
        {
            name: "달콤 와플 & 마카롱",
            category: "달달한 디저트",
            keywords: ["단 거", "디저트", "와플"],
            mainMenu: "누텔라 바나나 와플 + 음료",
            price: "5,000원",
            distance: "도보 2분 (120m)",
            seatsLeft: 12,
            totalSeats: 15
        }
    ];

    function setTaste(val) {
        document.getElementById('tasteInput').value = val;
    }

    function searchRestaurants() {
        const schoolName = document.getElementById('schoolInput').value.trim();
        const tasteQuery = document.getElementById('tasteInput').value.trim();

        if (!schoolName) {
            alert('학교 이름을 입력해 주세요!');
            return;
        }

        // 가상 학교 주소 업데이트
        document.getElementById('schoolAddress').innerText = `📍 ${schoolName} 근처 식당 탐색 결과`;

        const listContainer = document.getElementById('restaurantList');
        listContainer.innerHTML = '';

        // 검색 필터링 (키워드가 없으면 전체 출력)
        const filtered = mockRestaurants.filter(res => {
            if (!tasteQuery) return true;
            return res.category.includes(tasteQuery) || 
                   res.keywords.some(k => tasteQuery.includes(k) || k.includes(tasteQuery));
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-sub);">조건에 맞는 식당이 없습니다. 다른 키워드로 검색해보세요!</div>`;
        } else {
            filtered.forEach(res => {
                let seatClass = 'seat-available';
                let seatText = `여유 (${res.seatsLeft}/${res.totalSeats}석)`;

                if (res.seatsLeft === 0) {
                    seatClass = 'seat-full';
                    seatText = `만석 (대기 필요)`;
                } else if (res.seatsLeft <= 3) {
                    seatClass = 'seat-crowded';
                    seatText = `혼잡 (${res.seatsLeft}/${res.totalSeats}석)`;
                }

                const cardHtml = `
                    <div class="restaurant-card">
                        <div class="res-main">
                            <h3>${res.name} <span class="res-category">${res.category}</span></h3>
                            <div class="res-menu">대표메뉴: ${res.mainMenu}</div>
                            <div class="res-price">${res.price}</div>
                        </div>
                        <div class="res-status">
                            <span class="seat-badge ${seatClass}">${seatText}</span>
                            <span class="distance-info">🚶 ${res.distance}</span>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += cardHtml;
            });
        }

        document.getElementById('resultSection').classList.remove('hidden');
    }
</script>

</body>
</html>
