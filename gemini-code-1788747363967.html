<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바로점심 - 최적의 점심 식당 찾기</title>
    <style>
        :root {
            --primary-color: #3182CE;
            --success-color: #38A169;
            --warning-color: #D69E2E;
            --danger-color: #E53E3E;
            --bg-color: #EDF2F7;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: #2D3748;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            color: var(--primary-color);
            margin: 0 0 6px 0;
            font-size: 28px;
        }

        header p {
            color: #718096;
            font-size: 14px;
            margin: 0;
        }

        .step-box {
            background: #F7FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .step-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: block;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #4A5568;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #CBD5E0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .restaurant-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .restaurant-item {
            padding: 12px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .restaurant-item:hover, .restaurant-item.selected {
            border-color: var(--primary-color);
            background-color: #EBF8FF;
        }

        .seat-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background: #E2E8F0;
            font-weight: bold;
        }

        .seat-available {
            background: #C6F6D5;
            color: #22543D;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #2B6CB0;
        }

        /* 결과 화면 */
        #result-section {
            display: none;
            margin-top: 24px;
            border-top: 2px dashed #CBD5E0;
            padding-top: 20px;
        }

        .result-card {
            padding: 16px;
            border-radius: 12px;
            color: white;
            margin-bottom: 12px;
        }

        .res-success { background-color: var(--success-color); }
        .res-warning { background-color: var(--warning-color); }
        .res-danger { background-color: var(--danger-color); }

        .timeline-box {
            background: #F7FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>바로점심 🍱</h1>
        <p>점심시간 안에 먹고 올 수 있는 최적의 식당 찾기</p>
    </header>

    <!-- STEP 1: 지역 및 메뉴 -->
    <div class="step-box">
        <span class="step-title">STEP 1. 지역 & 먹고 싶은 메뉴</span>
        <div class="form-group">
            <label>지역 입력</label>
            <input type="text" id="location" value="서울시 마포구" placeholder="예: 서울시 강남구">
        </div>
        <div class="form-group">
            <label>희망 메뉴</label>
            <input type="text" id="menu" placeholder="예: 떡볶이, 돈까스, 라면">
        </div>
    </div>

    <!-- STEP 2 & 3: 중학교 및 점심시간 -->
    <div class="step-box">
        <span class="step-title">STEP 2 & 3. 학교 및 점심시간 설정</span>
        <div class="form-group">
            <label>다니는 중학교 선택</label>
            <select id="school">
                <option value="중앙중학교">중앙중학교</option>
                <option value="성산중학교">성산중학교</option>
                <option value="마포중학교">마포중학교</option>
            </select>
        </div>
        <div class="form-group">
            <label>점심시간 총 분 수 (분 단위)</label>
            <input type="number" id="lunchTime" value="60" placeholder="예: 60 (1시간)">
        </div>
    </div>

    <!-- STEP 4: 식당 선택 -->
    <div class="step-box">
        <span class="step-title">STEP 4. 주변 식당 현황 (좌석 및 거리)</span>
        <div class="restaurant-list">
            <div class="restaurant-item" onclick="selectRestaurant(this, '바로떡볶이', 5, 3, 5)">
                <div>
                    <strong>바로떡볶이</strong> <br>
                    <small>도보 5분 | 조리 3분</small>
                </div>
                <span class="seat-badge seat-available">남은 좌석 8석</span>
            </div>
            <div class="restaurant-item" onclick="selectRestaurant(this, '스피드돈까스', 8, 10, 2)">
                <div>
                    <strong>스피드돈까스</strong> <br>
                    <small>도보 8분 | 조리 10분</small>
                </div>
                <span class="seat-badge seat-available">남은 좌석 3석</span>
            </div>
            <div class="restaurant-item" onclick="selectRestaurant(this, '열정라멘', 12, 15, 0)">
                <div>
                    <strong>열정라멘</strong> <br>
                    <small>도보 12분 | 조리 15분</small>
                </div>
                <span class="seat-badge">남은 좌석 0석 (만석)</span>
            </div>
        </div>
    </div>

    <button class="btn-submit" onclick="calculateLunch()">AI 분석 및 결과 보기</button>

    <!-- STEP 5: 결과 산출 -->
    <div id="result-section">
        <span class="step-title">STEP 5. 바로점심 AI 분석 결과</span>
        <div id="result-card" class="result-card"></div>
        <div class="timeline-box" id="timeline-box"></div>
    </div>
</div>

<script>
    let selectedRes = null;

    function selectRestaurant(element, name, walkTime, cookTime, seats) {
        document.querySelectorAll('.restaurant-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedRes = { name, walkTime, cookTime, seats };
    }

    function calculateLunch() {
        if (!selectedRes) {
            alert('STEP 4에서 마음에 드는 식당을 선택해주세요!');
            return;
        }

        const lunchTime = parseInt(document.getElementById('lunchTime').value);
        const eatTime = 15; // 평균 식사 시간 15분 고정
        const totalWalkTime = selectedRes.walkTime * 2; // 왕복 이동 시간
        const totalRequiredTime = totalWalkTime + selectedRes.cookTime + eatTime;

        const resultCard = document.getElementById('result-card');
        const timelineBox = document.getElementById('timeline-box');

        let statusClass = '';
        let statusTitle = '';
        let statusMessage = '';

        // 판단 알고리즘
        if (selectedRes.seats === 0) {
            statusClass = 'res-danger';
            statusTitle = '🔴 이용 불가 (만석)';
            statusMessage = '현재 식당에 빈 좌석이 없습니다. 다른 식당을 선택하세요.';
        } else if (totalRequiredTime <= lunchTime - 10) {
            statusClass = 'res-success';
            statusTitle = '🟢 여유롭게 가능!';
            statusMessage = `총 소요시간은 약 ${totalRequiredTime}분입니다. 여유롭게 복귀할 수 있습니다.`;
        } else if (totalRequiredTime <= lunchTime) {
            statusClass = 'res-warning';
            statusTitle = '🟡 시간에 딱 맞음 (촉박)';
            statusMessage = `총 소요시간이 약 ${totalRequiredTime}분입니다. 음식을 빨리 먹거나 서둘러 이동해야 합니다.`;
        } else {
            statusClass = 'res-danger';
            statusTitle = '🔴 시간 초과 (지각 위험)';
            statusMessage = `총 소요시간(${totalRequiredTime}분)이 점심시간(${lunchTime}분)을 초과합니다. 추천하지 않습니다.`;
        }

        resultCard.className = `result-card ${statusClass}`;
        resultCard.innerHTML = `
            <h3 style="margin:0 0 8px 0;">${selectedRes.name} - ${statusTitle}</h3>
            <p style="margin:0; font-size:14px;">${statusMessage}</p>
        `;

        timelineBox.innerHTML = `
            <strong>⏱️ 예상 세부 타임라인 (총 ${totalRequiredTime}분 소요)</strong><br>
            • 학교 ↔ 식당 왕복 이동: ${totalWalkTime}분 (편도 ${selectedRes.walkTime}분)<br>
            • 음식 조리 대기: ${selectedRes.cookTime}분<br>
            • 식사 시간: ${eatTime}분<br>
            • 현재 남은 좌석: <strong>${selectedRes.seats}석</strong>
        `;

        document.getElementById('result-section').style.display = 'block';
    }
</script>

</body>
</html>
